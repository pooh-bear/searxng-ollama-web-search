services:
  redis:
    image: docker.io/valkey/valkey:8-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    networks:
      - searxng
    volumes:
      - valkey-data2:/data
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    networks:
      - searxng
    ports:
      - "${SEARXNG_PORT:-8080}:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
      # The engine module is mounted into the image so it can be registered
      # as "ollama_web" from settings.yml.  A bind mount (rather than a
      # derived Dockerfile) keeps it editable without rebuilding.
      - type: bind
        source: ./engines/ollama_web.py
        target: /usr/local/searxng/searx/engines/ollama_web.py
    # API keys live in ./searxng.env (chmod 600), e.g. OLLAMA_API_KEY=...
    # The file is optional, so this stack still starts without any keys.
    #
    # Note: values under "environment:" take precedence over "env_file:".
    # Do not repeat OLLAMA_API_KEY there with an empty default, or the empty
    # value will clobber the key from the env file.
    env_file:
      - path: ./searxng.env
        required: false
    environment:
      # Set this to the URL your instance is reachable at, or leave it out.
      # - SEARXNG_BASE_URL=https://search.example.com/
      - UWSGI_WORKERS=${SEARXNG_UWSGI_WORKERS:-4}
      - UWSGI_THREADS=${SEARXNG_UWSGI_THREADS:-4}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

networks:
  searxng:

volumes:
  valkey-data2:
